spring.application.name=springboot_netty_advanced
server.port=8080

# Netty TCP server (deepblue.inaction_02_springboot)
netty.server.port=9000
netty.server.boss-threads=1
netty.server.worker-threads=0
netty.server.biz-threads=16
netty.server.reader-idle-seconds=60
netty.server.max-frame-length=8192

# \u94FE\u8DEF\u8FFD\u8E2A\u65E5\u5FD7\uFF1ADEBUG \u4F1A\u6253\u5370\u6BCF\u6761\u6D88\u606F\u7684 decode / recv / reply / send / encode\uFF0C\u6392\u67E5\u5B8C\u53EF\u6539\u56DE INFO
logging.level.deepblue.inaction_02_springboot=INFO
